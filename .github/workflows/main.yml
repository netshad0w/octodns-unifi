name: octoDNS UnifiProvider
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.load.outputs.json }}
    steps:
    - id: load
      run: |
        delim="EOF_$(openssl rand -hex 12)"
        {
          echo "json<<${delim}"
          curl -fsSL https://github.com/octodns/octodns/raw/main/.ci-config.json \
            | jq -c '
                def ok: try ((split(".") | map(tonumber)) >= [3,11]) catch false;
                .python_versions_active |= map(select(ok))
                | .python_version_current |= (if ok then . else "3.11" end)
              '
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"
  ci:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.config.outputs.json).python_versions_active }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: CI Build
        run: |
          ./script/cibuild
  setup-py:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ fromJson(needs.config.outputs.json).python_version_current }}
          architecture: x64
      - name: CI setup.py
        run: |
          ./script/cibuild-setup-py
