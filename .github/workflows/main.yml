name: octoDNS UnifiProvider
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.load.outputs.json }}
    steps:
    - id: load
      run: |
        delim="EOF_$(openssl rand -hex 12)"
        {
          echo "json<<${delim}"
          curl -fsSL https://github.com/octodns/octodns/raw/main/.ci-config.json \
            | jq -c '
                def ok: try ((split(".") | map(tonumber)) >= [3,11]) catch false;
                .python_versions_active |= map(select(ok))
                | .python_version_current |= (if ok then . else "3.11" end)
              '
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"
  ci:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.config.outputs.json).python_versions_active }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: CI Build
        run: |
          ./script/cibuild
  setup-py:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJson(needs.config.outputs.json).python_version_current }}
          architecture: x64
      - name: CI setup.py
        run: |
          ./script/cibuild-setup-py
