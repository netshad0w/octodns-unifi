name: octoDNS UnifiProvider
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.load.outputs.json }}
    steps:
    - id: load
      run: |
        delim="EOF_$(openssl rand -hex 12)"
        {
          echo "json<<${delim}"
          curl -fsSL https://github.com/octodns/octodns/raw/main/.ci-config.json \
            | jq -c '
                def supported: (split(".") | map(tonumber)) as $v | $v[0] > 3 or ($v[0] == 3 and $v[1] >= 11);
                .python_versions_active |= map(select(try supported catch false))
                | .python_version_current |= (try (if supported then . else "3.11" end) catch "3.11")
              '
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"
  ci:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.config.outputs.json).python_versions_active }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: CI Build
        run: |
          ./script/cibuild
  setup-py:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ fromJson(needs.config.outputs.json).python_version_current }}
          architecture: x64
      - name: CI setup.py
        run: |
          ./script/cibuild-setup-py
